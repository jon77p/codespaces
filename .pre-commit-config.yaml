---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_language_version:
  python: python3.10
repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-json
        exclude: ^\.devcontainer\.json$
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: forbid-new-submodules
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: .md
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df # frozen: 0.39.0
    hooks:
      - id: check-dependabot
      - id: check-github-actions
      - id: check-github-workflows
      - id: check-renovate
  # General Linting-related hooks
  - repo: https://github.com/markdownlint/markdownlint
    rev: 7810020e1bf3cb3eef0733cd754bc5bc00a5de5a # frozen: v0.18.1
    hooks:
      - id: markdownlint
        args:
          [
            --config,
            ".github/lint/.markdownlint.yaml",
            --ignore-path,
            ".gitignore",
          ]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0 # frozen: v3.0.0-alpha.0
    hooks:
      - id: prettier
        args:
          [
            --config,
            ".github/lint/.prettierrc.yaml",
            --ignore-path,
            ".gitignore",
          ]
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: [--config-file, .github/lint/.yamllint.yaml]
  # Secrets-related hooks
  - repo: https://github.com/gitguardian/gg-shield
    rev: 4cccd600fd3890a7aba07fd0a45e483f3099fe70 # frozen: v1.56.1
    hooks:
      - id: ggshield
        args: [secret, scan, pre-commit]
  - repo: https://github.com/sirwart/ripsecrets
    rev: 7d94620933e79b8acaa0cd9e60e9864b07673d86 # frozen: v0.1.11
    hooks:
      - id: ripsecrets
  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.1 # frozen: v8.13.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/godaddy/tartufo
    rev: 869cb428eaea3a5ef90082a7a3054d9080183807 # frozen: v6.0.1
    hooks:
      - id: tartufo
        args: [pre-commit]
  # Python-related hooks
  - repo: https://github.com/pycqa/pylint
    rev: e75de10c69103381c875601f638d4b977ff0fcaf # frozen: v4.1.3
    hooks:
      - id: pylint
        args: ["-rn", "-sn", "--rcfile=.github/lint/.pylintrc"]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 2834ec6639549dd6796205c8f011dedcd587288b # frozen: v2.4.0
    hooks:
      - id: mypy
        args:
          [
            --ignore-missing-imports,
            --follow-imports=silent,
            --no-strict-optional,
          ]
  - repo: https://github.com/psf/black
    rev: 258e7dbf348bc23cb70b8cdf693481c04634ebcc # frozen: 26.10.1
    hooks:
      - id: black
  # Golang-related hooks
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: fb24a639f7c938759fe56eeebbb7713b69d60494 # frozen: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-vet
      - id: go-mod-tidy
      - id: go-mod-vendor
  # Terraform-related hooks
  - repo: https://github.com/gruntwork-io/pre-commit
    rev: 40f924cd642f5dc98d12bd97b07f3752223553da # frozen: v0.1.30
    hooks:
      - id: terraform-fmt
      - id: terraform-validate
      - id: tflint
  - repo: https://github.com/aquasecurity/tfsec
    rev: b692c20b68c0121346b7b34e81d6b1867ca8e1a8 # frozen: v1.28.14
    hooks:
      - id: tfsec
  # Ansible-related hooks
  - repo: https://github.com/ansible-community/ansible-lint.git
    rev: 9bce2bfb8f4a984e6b13767bc0d6bf0a49492164 # frozen: v26.10.1
    hooks:
      - id: ansible-lint
        args: [-c, .ansible-lint.yml]
        files: "^ansible/"
  # Docker-related hooks
  - repo: https://github.com/hadolint/hadolint
    rev: 2eece55955ced00200be9729e9728cb7dacca505 # frozen: v2.15.1
    hooks:
      - id: hadolint-docker
